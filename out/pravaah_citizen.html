<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRAVAAH Citizen</title>
<style>
  :root{
    --bg:#0d1117; --card:#161c24; --line:#242e3a; --ink:#e9eef4; --dim:#8e9bab;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#05080c;color:var(--ink);display:flex;
       justify-content:center;padding:18px 12px 40px;
       font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .phone{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--line);
         border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0009}
  header{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;letter-spacing:.3px}
  h1 span{color:var(--dim);font-weight:400}
  select{width:100%;margin-top:10px;background:var(--card);color:var(--ink);
         border:1px solid var(--line);border-radius:9px;padding:10px 11px;
         font:inherit;font-size:15px}
  main{padding:14px 16px 20px}
  .band{border-radius:12px;padding:13px 14px;margin-bottom:13px;font-weight:600}
  .band.go{background:#3a1d1b;border:1px solid #6b2a2a;color:#ffb4ae}
  .band.mid{background:#2c2519;border:1px solid #6b5326;color:#f0cd7a}
  .band.ok{background:#12291a;border:1px solid #2a6b38;color:#8ee79c}
  .band small{display:block;font-weight:400;color:var(--dim);margin-top:4px;font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:13px 14px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
           color:var(--dim);font-weight:600}
  .big{font-size:20px;font-weight:600;line-height:1.3}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
       border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .row:last-child{border-bottom:0}
  .row span{color:var(--dim)}
  .note{color:var(--dim);font-size:12.5px;line-height:1.6}
  .mode{display:flex;gap:6px;margin:9px 0 4px;flex-wrap:wrap}
  .mode div{flex:1;min-width:66px;text-align:center;border-radius:9px;padding:8px 4px;
            font-size:11px;border:1px solid var(--line);background:#0f151d;color:var(--dim)}
  .mode div.on{color:var(--ink);font-weight:600}
  .mode div b{display:block;font-size:16px;margin-bottom:2px}
  .road{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .road:last-child{border-bottom:0}
  .road b{color:var(--ink)} .road span{color:var(--dim);font-size:12px}
  .sms{background:#0f151d;border:1px dashed var(--line);border-radius:10px;padding:11px;
       font-size:13.5px;line-height:1.6}
  footer{padding:12px 16px 16px;border-top:1px solid var(--line);color:var(--dim);
         font-size:11.5px;line-height:1.6}
  button{width:100%;background:#1c2530;color:var(--ink);border:1px solid var(--line);
         border-radius:10px;padding:11px;font:inherit;cursor:pointer;margin-top:8px}
  button:active{background:#243040}
</style>

<div class="phone">
  <header>
    <h1>PRAVAAH <span id="ev"></span></h1>
    <select id="pick"></select>
  </header>
  <main id="body"></main>
  <footer id="foot"></footer>
</div>

<script>
const $ = id => document.getElementById(id);
let D = null;

D = {"event":"patna","peak":"2019-09-30","units":[{"place":"Biddupur","people":16654,"buildings":2013,"km2":21.0,"med":1.43,"mx":6.88,"lat":25.6880265,"lon":85.3133852,"shelter":"Keshav Vidya Mandir","slat":25.59661509206487,"slon":85.18017414867239,"km":16.7,"stranded":0,"bridge":160},{"place":"Fatuha","people":15963,"buildings":1431,"km2":54.8,"med":0.57,"mx":9.2,"lat":25.5085264,"lon":85.3099134,"shelter":"Loyola High School","slat":25.63537396747675,"slon":85.10819208347695,"km":24.6,"stranded":59,"bridge":14081},{"place":"Hajipur","people":11128,"buildings":1145,"km2":15.7,"med":0.82,"mx":8.2,"lat":25.6905702,"lon":85.2090351,"shelter":"NIFT Patna","slat":25.59448347944308,"slon":85.1356852456926,"km":12.9,"stranded":0,"bridge":703},{"place":"Bidupur","people":6058,"buildings":573,"km2":14.5,"med":1.15,"mx":8.7,"lat":25.6508017,"lon":85.3236759,"shelter":"Indian Public School, Hajipur","slat":25.693102244122752,"slon":85.2274633734124,"km":10.7,"stranded":70,"bridge":813},{"place":"Ranipur","people":3681,"buildings":769,"km2":7.5,"med":0.25,"mx":3.65,"lat":25.5873778,"lon":85.2068041,"shelter":"Chanakya National Law University","slat":25.593931574828293,"slon":85.13333741361805,"km":7.4,"stranded":0,"bridge":439},{"place":"Mehdiganj","people":1629,"buildings":187,"km2":1.1,"med":0.56,"mx":8.7,"lat":25.5902676,"lon":85.2081159,"shelter":"Notre Dame Academy","slat":25.634330436908307,"slon":85.10872702980672,"km":11.1,"stranded":0,"bridge":4},{"place":"Sampatchak","people":1057,"buildings":63,"km2":3.5,"med":0.2,"mx":6.7,"lat":25.5400698,"lon":85.1767981,"shelter":"Chandragupt Institute of Management Patna","slat":25.588102556387792,"slon":85.1317561291855,"km":7.0,"stranded":0,"bridge":312},{"place":"Punpun","people":942,"buildings":18,"km2":0.6,"med":2.51,"mx":4.2,"lat":25.4957802,"lon":85.1043839,"shelter":"Chandragupt Institute of Management Patna","slat":25.588102556387792,"slon":85.1317561291855,"km":10.6,"stranded":0,"bridge":370},{"place":"Hakimganj","people":699,"buildings":164,"km2":2.7,"med":1.04,"mx":8.7,"lat":25.5951844,"lon":85.2082906,"shelter":"Chanakya National Law University","slat":25.593931574828293,"slon":85.13333741361805,"km":7.5,"stranded":0,"bridge":83},{"place":"Rajendra Nagar","people":485,"buildings":39,"km2":1.3,"med":2.66,"mx":8.2,"lat":25.6005216,"lon":85.1640085,"shelter":"Patna Women's College","slat":25.61134287913171,"slon":85.1245688760683,"km":4.1,"stranded":0,"bridge":106},{"place":"Dighwara","people":473,"buildings":36,"km2":7.2,"med":2.24,"mx":4.91,"lat":25.7434481,"lon":85.0010412,"shelter":"High School","slat":25.63818671596058,"slon":85.04565706025068,"km":12.5,"stranded":462,"bridge":5},{"place":"Patna","people":258,"buildings":22,"km2":1.9,"med":1.2,"mx":7.2,"lat":25.6093239,"lon":85.1235252,"shelter":"St. Paul's School","slat":25.62078549566935,"slon":85.1250357416151,"km":1.3,"stranded":0,"bridge":62},{"place":"Danapur","people":192,"buildings":42,"km2":1.7,"med":1.91,"mx":6.2,"lat":25.6358901,"lon":85.0474045,"shelter":"High School","slat":25.63818671596058,"slon":85.04565706025068,"km":0.3,"stranded":0,"bridge":0},{"place":"Digha","people":126,"buildings":42,"km2":1.6,"med":3.13,"mx":6.7,"lat":25.6442176,"lon":85.0907338,"shelter":"Notre Dame Academy","slat":25.634330436908307,"slon":85.10872702980672,"km":2.1,"stranded":0,"bridge":0},{"place":"Sonepur","people":79,"buildings":59,"km2":2.8,"med":1.19,"mx":7.2,"lat":25.6977651,"lon":85.1569507,"shelter":"university at 25.6295N 85.1021E","slat":null,"slon":null,"km":null,"stranded":0,"bridge":57},{"place":"Naubatpur","people":59,"buildings":9,"km2":0.1,"med":0.7,"mx":1.2,"lat":25.4990595,"lon":84.9609098,"shelter":"Balika school,khagaul","slat":25.580257283701386,"slon":85.04555091757065,"km":12.4,"stranded":0,"bridge":30},{"place":"Neora","people":3,"buildings":1,"km2":0.2,"med":3.7,"mx":3.7,"lat":25.5761047,"lon":84.9875629,"shelter":"middle school(Dariyapur)","slat":25.573178221852203,"slon":84.9996047562854,"km":1.2,"stranded":0,"bridge":0},{"place":"Walmi Complex","people":1,"buildings":0,"km2":0.0,"med":1.7,"mx":1.7,"lat":25.570235,"lon":85.0462035,"shelter":"","slat":25.609355938079997,"slon":85.05343478384373,"km":4.4,"stranded":0,"bridge":0}],"roads":[{"name":"JP Ganga Path","lat":25.6236064,"lon":85.1419147,"worst":"boat","depth":2.33,"when":"Wed 09 Oct 19:00","frm":"boat","to":"foot"},{"name":"Mayaram Haat - Nawanagar Road","lat":25.6532528,"lon":85.3420001,"worst":"boat","depth":2.17,"when":"Tue 08 Oct 15:00","frm":"boat","to":"foot"},{"name":"Mayaram Haat- Chaksikandar Road","lat":25.6726473,"lon":85.3507459,"worst":"boat","depth":2.12,"when":"Wed 18 Sep 03:00","frm":"foot","to":"boat"},{"name":"Road NUmber 5","lat":25.6918266,"lon":85.2499431,"worst":"foot","depth":1.3,"when":"Wed 09 Oct 14:00","frm":"foot","to":"bike"},{"name":"Chakbihari- English Khajwatta Road","lat":25.6610012,"lon":85.3540495,"worst":"foot","depth":1.26,"when":"Wed 09 Oct 08:00","frm":"foot","to":"bike"},{"name":"Road Number 4","lat":25.6918548,"lon":85.2496463,"worst":"foot","depth":1.26,"when":"Wed 09 Oct 08:00","frm":"foot","to":"bike"},{"name":"Vastu Vihar Colony Road","lat":25.6926979,"lon":85.2492955,"worst":"foot","depth":1.19,"when":"Tue 08 Oct 18:00","frm":"foot","to":"bike"},{"name":"Road Number 3","lat":25.6921682,"lon":85.2494037,"worst":"foot","depth":1.18,"when":"Tue 08 Oct 15:00","frm":"foot","to":"bike"},{"name":"Chandpura Saidabad- Mayaram Haat Road","lat":25.6517598,"lon":85.3483482,"worst":"foot","depth":1.07,"when":"Wed 18 Sep 08:00","frm":"bike","to":"foot"},{"name":"Road Number 2","lat":25.6922645,"lon":85.2491444,"worst":"foot","depth":1.03,"when":"Wed 18 Sep 12:00","frm":"bike","to":"foot"},{"name":"Road number 1","lat":25.6927829,"lon":85.248998,"worst":"foot","depth":0.99,"when":"Wed 18 Sep 16:00","frm":"bike","to":"foot"},{"name":"Patna Gaya Road (State Highway- 1)","lat":25.489389,"lon":85.1837332,"worst":"foot","depth":0.94,"when":"Wed 18 Sep 01:00","frm":"car","to":"bike"},{"name":"Izra Road","lat":25.7354867,"lon":85.2203042,"worst":"foot","depth":0.81,"when":"Wed 18 Sep 14:00","frm":"car","to":"bike"},{"name":"Chandpura Saidabad - Mohanpur Milky Road","lat":25.665566,"lon":85.3473247,"worst":"foot","depth":0.73,"when":"Wed 18 Sep 21:00","frm":"car","to":"bike"},{"name":"hajipur jandaha road","lat":25.6843039,"lon":85.2992061,"worst":"foot","depth":0.71,"when":"Wed 18 Sep 23:00","frm":"car","to":"bike"},{"name":"Alternate road for Izra/ Salimabad","lat":25.7488384,"lon":85.2144613,"worst":"foot","depth":0.7,"when":"Thu 19 Sep 00:00","frm":"car","to":"bike"},{"name":"Salimabad Phulhara Road","lat":25.752856,"lon":85.2151911,"worst":"foot","depth":0.65,"when":"Thu 19 Sep 05:00","frm":"car","to":"bike"},{"name":"BICA Road","lat":25.7207956,"lon":85.2302441,"worst":"foot","depth":0.59,"when":"Thu 19 Sep 12:00","frm":"car","to":"bike"}],"built":"01 Sep 2026 02:43","modes":[[0.3,"car"],[0.5,"bike"],[1.5,"foot"],[999,"boat"]]};

function boot() {
  $('ev').textContent = '· ' + D.event + ', ' + D.peak;
  D.units.sort((a, b) => b.people - a.people);
  $('pick').innerHTML = D.units.map((u, i) =>
    `<option value="${i}">${esc(u.place)} · ${fmt(u.people)} people</option>`).join('');
  // remember the reader's own area between visits; this is the one thing a
  // citizen page should not ask twice
  let start = 0;
  try {
    const saved = localStorage.getItem('pravaah.place');
    const k = D.units.findIndex(u => u.place === saved);
    if (k >= 0) start = k;
  } catch (e) {}
  $('pick').value = start;
  $('pick').onchange = () => show(+$('pick').value);
  $('foot').innerHTML =
    'Built ' + esc(D.built) + '. Depth is what the model gives for your area, not for '
    + 'your doorstep. Shelter capacity is measured from roof area at the national '
    + 'minimum of 3.5 sq m per person. If the water is already at your door, do not '
    + 'wait for a page: call <b>1070</b> or <b>112</b>.';
  show(start);
}

function show(i) {
  const u = D.units[i];
  try { localStorage.setItem('pravaah.place', u.place); } catch (e) {}
  const md = u.med, mx = u.mx;
  const sev = md >= 1 ? 'go' : md >= 0.3 ? 'mid' : 'ok';
  const head = md >= 1
    ? 'Leave now. Water here reaches ' + md.toFixed(1) + ' m.'
    : md >= 0.3
      ? 'Get ready to leave. Water here reaches ' + md.toFixed(1) + ' m.'
      : 'Stay alert. Water here is shallow, ' + md.toFixed(2) + ' m typical.';

  const modes = D.modes.map(([lim, name]) => {
    const on = md < lim;
    const label = {car: 'Car', bike: 'Two-wheeler', foot: 'On foot', boat: 'Boat only'}[name];
    const icon = {car: '\u{1F697}', bike: '\u{1F6F5}', foot: '\u{1F6B6}', boat: '\u{1F6F6}'}[name];
    return `<div class="${on ? 'on' : ''}"><b>${icon}</b>${label}${on ? '' : ' ×'}</div>`;
  }).join('');

  const nearRoads = D.roads
    .map(r => ({...r, d: Math.hypot(r.lat - (u.lat ?? r.lat), r.lon - (u.lon ?? r.lon))}))
    .sort((a, b) => a.d - b.d).slice(0, 3);

  $('body').innerHTML =
    `<div class="band ${sev}">${esc(head)}<small>Deepest point in ${esc(u.place)}: ${mx.toFixed(1)} m.
       ${fmt(u.people)} people and ${fmt(u.buildings)} buildings are in the wet area.</small></div>`

    + (u.stranded > 0
      ? `<div class="band go">No road reaches ${fmt(u.stranded)} people here at any water level.
         <small>If that is you, a vehicle is not coming. Ask for a boat on 1070 and say
         you are cut off, not just flooded.</small></div>` : '')

    + `<div class="card"><h3>Where you go</h3>`
    + (u.shelter
      ? `<div class="big">${esc(u.shelter)}</div>
         <div class="note">${u.km !== null ? u.km + ' km away' : 'distance not computed'}
         ${u.slat ? ' · ' + u.slat.toFixed(4) + 'N ' + u.slon.toFixed(4) + 'E' : ''}</div>
         ${u.slat ? `<button onclick="nav(${u.slat},${u.slon})">Open in maps</button>` : ''}`
      : `<div class="note">No shelter was assigned to this area in this plan.</div>`)
    + `</div>`

    + `<div class="card"><h3>How you can travel</h3><div class="mode">${modes}</div>
       <div class="note">Based on ${md.toFixed(2)} m of water. A road with deeper water
       than its mode allows will strand a vehicle, not slow it down.</div></div>`

    + (u.bridge > 0
      ? `<div class="card"><h3>Warning</h3>
         <div class="note">${fmt(u.bridge)} people in this area reach their shelter
         <b>only across a bridge</b>. Nobody has confirmed those bridges are open.
         Check before you commit to that route.</div></div>` : '')

    + (nearRoads.length
      ? `<div class="card"><h3>Roads near you</h3>` + nearRoads.map(r =>
          `<div class="road"><b>${esc(r.name)}</b><br>
           <span>${esc(r.frm)} → ${esc(r.to)} at ${esc(r.when)} · up to ${r.depth} m</span></div>`
        ).join('') + `</div>` : '')

    + `<div class="card"><h3>Message that would be broadcast</h3>
       <div class="sms">${esc(u.place.toUpperCase())}: Flood water expected.
       Go to ${esc(u.shelter || 'the nearest shelter')} before 8pm.
       Cannot walk? Reply 1. -DDMA</div></div>`;
}

function nav(la, lo) {
  // a plain geo: link so it opens whatever map app the phone actually has,
  // including offline ones, instead of assuming a specific provider
  location.href = `geo:${la},${lo}?q=${la},${lo}`;
}
const fmt = n => Number(n).toLocaleString('en-IN');
function esc(s) { return String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

boot();
</script>
